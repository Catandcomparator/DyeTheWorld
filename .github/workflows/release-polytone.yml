name: Release
on:
  push:
    branches:
      - 1.20.x
    paths:
      - polytone/*.zip

env:
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: 2j2IcOdG
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            polytone/*.zip
          version: 1.0.${{ GITHUB_RUN_NUMBER }}
          game-versions: |
            1.20.1
          dependencies: |
            polytone